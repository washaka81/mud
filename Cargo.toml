[package]
name = "forge_llm"
version = "0.1.0"
edition = "2021"
authors = ["Alejandro Fonda <alejandro.fonda@gmail.com>"]
description = "Ultra-optimized Ternary MoE inference engine (MUD architecture)"
license = "GPL-3.0-or-later"
repository = "https://github.com/washaka81/mud"
readme = "README.md"
default-run = "forge_llm"



[dependencies]
# Memory mapping for loading .mud files efficiently
memmap2 = "0.9.3"
half = { version = "2.3.1", features = ["num-traits"] }

# Vulkan ecosystem for iGPU compute offloading
vulkano = "0.34.0"
vulkano-shaders = "0.34.0"

# Core utilities
log = "0.4.20"
env_logger = "0.10.1"
anyhow = "1.0.75"
rand = "0.10.1"
rand_distr = "0.5.1"
crossterm = "0.29.0"
unicode-width = "0.2.2"
sysinfo = "0.38.4"
serde_json = "1.0.149"
byteorder = "1.5.0"
parking_lot = "0.12.5"
rayon = "1.12.0"
zip = "8.6.0"
pdf-extract = "0.10.0"
roxmltree = "0.21.1"
safetensors = "0.4.3"
ctrlc = "3.4.0"
forge_autograd = { version = "0.1.0", path = "forge_autograd" }
ratatui = "0.26.1"
comfy-table = "7.1.0"
gguf = "0.1.2"
candle-core = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
wait-timeout = "0.2.1"
bytemuck = "1.25.0"
core_affinity = "0.8.3"
ash = "0.38.0"
gpu-allocator = "0.28.0"

[[bin]]
name = "forge_llm"
path = "src/main.rs"

[[bin]]
name = "model_dumper"
path = "tools/model_dumper.rs"




[[bin]]
name = "step_inference"
path = "tools/step_inference.rs"












[[bin]]
name = "universal_converter"
path = "tools/universal_converter/main.rs"





[lib]
name = "forge_llm"
crate-type = ["cdylib", "lib"]

[build-dependencies]
# Used to compile ASM files during the build process
cc = "1.0.83"







[[bin]]
name = "recalibration_projector"
path = "tools/recalibration_projector.rs"

[[bin]]
name = "run_trainer"
path = "tools/run_trainer.rs"




[[bin]]
name = "diagnose_model"
path = "tools/diagnose_model.rs"






[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Target CPU features should be specified during compilation (e.g. RUSTFLAGS="-C target-cpu=native")





[[bin]]
name = "mud_forge"
path = "tools/mud_forge.rs"

[[bin]]
name = "iteration_validator"
path = "tools/iteration_validator.rs"

[[bin]]
name = "conversion_verifier"
path = "tools/conversion_verifier.rs"

[[bin]]
name = "training_estimator"
path = "tools/training_estimator.rs"


[[bin]]
name = "boundary_validator"
path = "tools/boundary_validator.rs"











[[bin]]
name = "train_telemetry"
path = "tools/train_telemetry.rs"




